<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contratos">
<meta name="theme-color" content="#1a1a1a">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario de Contratos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f4f0;color:#1a1a1a;min-height:100vh}
header{background:#1a1a1a;color:#fff;padding:1.25rem 2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.header-left{display:flex;align-items:center;gap:.75rem}
header h1{font-size:1rem;font-weight:500}
.nav-tabs{display:flex;gap:.35rem;align-items:center}
.nav-tab{padding:6px 14px;font-size:12px;font-weight:500;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.15);border-radius:7px;cursor:pointer;text-decoration:none;transition:all .15s}
.nav-tab:hover{background:rgba(255,255,255,.18);color:#fff}
.nav-tab.active{background:#fff;color:#1a1a1a;border-color:#fff}
.page{max-width:1100px;margin:0 auto;padding:1.5rem 1.5rem 4rem}

/* Controls */
.controls{display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap}
.btn-nav{padding:6px 12px;font-size:13px;background:#fff;border:1px solid #ddd;border-radius:7px;cursor:pointer;color:#333;font-weight:500}
.btn-nav:hover{background:#f5f5f5}
.range-label{font-size:14px;font-weight:600;color:#1a1a1a;min-width:180px;text-align:center}
.btn-hoy{padding:6px 14px;font-size:12px;background:#1a1a1a;color:#fff;border:none;border-radius:7px;cursor:pointer;font-weight:500}
.btn-hoy:hover{background:#333}
.zoom-group{display:flex;gap:.25rem;margin-left:auto}
.btn-zoom{padding:5px 11px;font-size:12px;background:#fff;border:1px solid #ddd;border-radius:6px;cursor:pointer;color:#555}
.btn-zoom.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}

/* Gantt */
.gantt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gantt{min-width:700px;width:100%}
.gantt-header{display:grid;margin-bottom:0}
.gantt-row{display:flex;align-items:stretch;min-height:56px;border-bottom:1px solid #eee}
.gantt-row:last-child{border-bottom:none}
.gantt-row:hover .gantt-track{background:#f9f9f9}
.room-label{flex-shrink:0;width:90px;font-size:12px;font-weight:700;color:#555;padding:.75rem .75rem .75rem 0;display:flex;align-items:center;border-right:2px solid #e0e0e0}
.gantt-track{flex:1;position:relative;overflow:hidden;background:#fff;cursor:default}
.gantt-bg{position:absolute;inset:0;display:flex}
.bg-cell{flex:1;border-right:1px solid #f0f0f0}
.bg-cell.today{background:#fffbeb}
.bg-cell.month-start{border-right:1px solid #e0e0e0}
.gantt-bar{position:absolute;top:8px;height:38px;border-radius:7px;display:flex;align-items:center;padding:0 8px;cursor:pointer;transition:opacity .15s,box-shadow .15s;user-select:none;overflow:hidden;min-width:4px}
.gantt-bar:hover{opacity:.85;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.gantt-bar.activo{background:#1D9E75;color:#fff}
.gantt-bar.pendiente{background:#f59e0b;color:#fff}
.gantt-bar.vencido{background:#cbd5e1;color:#555}
.bar-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-renta{font-size:9.5px;opacity:.8;white-space:nowrap;margin-left:4px}

/* Header months */
.gantt-head-row{display:flex;border-bottom:2px solid #e0e0e0;margin-bottom:0}
.head-room{flex-shrink:0;width:90px;border-right:2px solid #e0e0e0}
.head-months{flex:1;display:flex;overflow:hidden}
.head-month{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;padding:5px 6px;border-right:1px solid #e0e0e0;white-space:nowrap;overflow:hidden}
.head-days{flex:1;display:flex;overflow:hidden}
.head-day{flex:1;font-size:9px;font-weight:500;color:#bbb;text-align:center;padding:2px 0;border-right:1px solid #f5f5f5;min-width:0}
.head-day.today-hd{color:#1D9E75;font-weight:700}

/* Today line */
.today-line{position:absolute;top:0;bottom:0;width:2px;background:#ef4444;opacity:.6;pointer-events:none;z-index:10}

/* Detail panel */
.detail-panel{display:none;position:fixed;right:0;top:0;bottom:0;width:360px;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.12);z-index:200;overflow-y:auto;padding:1.5rem}
.detail-panel.open{display:block}
.detail-close{position:absolute;top:1rem;right:1rem;background:transparent;border:none;font-size:20px;cursor:pointer;color:#888;line-height:1}
.detail-close:hover{color:#333}
.detail-badge{display:inline-flex;align-items:center;gap:.35rem;font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;margin-bottom:1rem}
.detail-badge.activo{background:#dcfce7;color:#166534}
.detail-badge.pendiente{background:#fef9c3;color:#854d0e}
.detail-badge.vencido{background:#f3f4f6;color:#6b7280}
.detail-h{font-size:16px;font-weight:700;margin-bottom:.25rem}
.detail-sub{font-size:12px;color:#888;margin-bottom:1.25rem}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.25rem}
.detail-item label{display:block;font-size:10px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.detail-item span{font-size:13px;font-weight:500;color:#1a1a1a}
.detail-actions{display:flex;gap:.5rem;flex-wrap:wrap;padding-top:1rem;border-top:1px solid #f0f0f0}
.btn-detail{padding:7px 14px;font-size:12px;font-weight:500;border-radius:7px;cursor:pointer;text-decoration:none;display:inline-block}
.btn-detail-primary{background:#1a1a1a;color:#fff;border:none}
.btn-detail-primary:hover{background:#333}
.btn-detail-sec{background:#f5f5f5;color:#333;border:1px solid #e0e0e0}
.btn-detail-sec:hover{background:#ebebeb}

.overlay-bg{display:none;position:fixed;inset:0;z-index:199}
.overlay-bg.open{display:block}

.loading{text-align:center;padding:3rem;color:#aaa}
.empty{text-align:center;padding:3rem;color:#aaa;font-size:13px}

@media(max-width:680px){
  header{padding:1rem}
  .nav-tab{padding:5px 10px;font-size:11px}
  .room-label{width:60px;font-size:11px}
  .detail-panel{width:100%;right:0;left:0;top:auto;bottom:0;height:65vh;border-radius:14px 14px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.15)}
}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <a href="index.html" style="display:flex;align-items:center;text-decoration:none">
      <img src="/icons/apple-touch-icon.png" style="width:36px;height:36px;border-radius:8px;object-fit:cover;">
    </a>
    <h1>Contratos</h1>
  </div>
  <nav class="nav-tabs">
    <a href="panel.html" class="nav-tab">Panel</a>
    <a href="calendario.html" class="nav-tab active">Calendario</a>
    <a href="dashboard.html" class="nav-tab">Ingresos</a>
  </nav>
</header>

<div class="page">
  <div class="controls">
    <button class="btn-nav" onclick="navegar(-1)">&#8592;</button>
    <div class="range-label" id="range-label">—</div>
    <button class="btn-nav" onclick="navegar(1)">&#8594;</button>
    <button class="btn-hoy" onclick="irHoy()">Hoy</button>
    <div class="zoom-group">
      <button class="btn-zoom" id="z3" onclick="setZoom(3)">3m</button>
      <button class="btn-zoom active" id="z6" onclick="setZoom(6)">6m</button>
      <button class="btn-zoom" id="z12" onclick="setZoom(12)">12m</button>
    </div>
  </div>
  <div class="gantt-wrap">
    <div id="gantt-container" class="loading">Cargando contratos...</div>
  </div>
</div>

<!-- Detail panel -->
<div class="overlay-bg" id="overlay-bg" onclick="cerrarDetalle()"></div>
<div class="detail-panel" id="detail-panel">
  <button class="detail-close" onclick="cerrarDetalle()">✕</button>
  <div id="detail-content"></div>
</div>

<script>
const SUPABASE_URL = 'https://kyrjqbautyklefhqzqbo.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5cmpxYmF1dHlrbGVmaHF6cWJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMDgwNjUsImV4cCI6MjA5NjY4NDA2NX0.EXBSK0ZLJUsWt1iQ8btA1FkQE_aPT_MFkdgEhkP4Gh0';

let allContratos = [];
let zoomMeses = 6;
let startDate = null; // first day of view

const HABITACIONES = [1, 2, 3, 4];

function parseLocalDate(str){ if(!str) return null; const [y,m,d]=str.split('-'); return new Date(+y,+m-1,+d); }
function fmtFecha(ts){ return ts ? new Date(ts).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}) : '—'; }
function fmtMes(d){ return d.toLocaleDateString('es-ES',{month:'long',year:'numeric'}); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function daysBetween(a,b){ return Math.round((b-a)/(1000*60*60*24)); }

function getEstado(c){
  const d = c.datos;
  const conSeguro = !!d.seguro;
  const conAvalista = !!(d.avalista && d.av_nombre);
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const fin = parseLocalDate(d.ff);
  const margen = new Date(hoy); margen.setDate(margen.getDate() - 2);
  if(fin && fin < margen) return 'vencido';
  const firmasBase = c.firma_inquilino && c.firma_arrendador && c.firma_anexo_inquilino && c.firma_anexo_arrendador;
  const firmasSeguro = !conSeguro || (c.firma_lopd_inquilino && c.firma_lopd_arrendador);
  const firmasAvalista = !conAvalista || (c.firma_avalista_contrato && (!conSeguro || c.firma_lopd_avalista));
  if(!(firmasBase && firmasSeguro && firmasAvalista)) return 'pendiente';
  return 'activo';
}

async function loadContratos(){
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/contratos?select=*&order=created_at.desc`, {
      headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}
    });
    allContratos = await res.json();
  } catch(e){ console.error(e); }
}

function setZoom(m){
  zoomMeses = m;
  document.querySelectorAll('.btn-zoom').forEach(b=>b.classList.remove('active'));
  document.getElementById('z'+m)?.classList.add('active');
  renderGantt();
}

function navegar(dir){
  startDate = new Date(startDate);
  startDate.setMonth(startDate.getMonth() + dir * Math.max(1, Math.round(zoomMeses/2)));
  startDate.setDate(1);
  renderGantt();
}

function irHoy(){
  const hoy = new Date(); hoy.setDate(1); hoy.setHours(0,0,0,0);
  startDate = hoy;
  renderGantt();
}

function renderGantt(){
  const container = document.getElementById('gantt-container');
  if(!allContratos.length){ container.innerHTML='<div class="empty">No hay contratos.</div>'; return; }

  // Calculate view range
  const endDate = new Date(startDate);
  endDate.setMonth(endDate.getMonth() + zoomMeses);

  // Range label
  const opts = {month:'short',year:'numeric'};
  const labelEnd = new Date(endDate); labelEnd.setDate(labelEnd.getDate()-1);
  document.getElementById('range-label').textContent =
    startDate.toLocaleDateString('es-ES',opts) + ' — ' + labelEnd.toLocaleDateString('es-ES',opts);

  const totalDays = daysBetween(startDate, endDate);
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const todayOffset = daysBetween(startDate, hoy);

  // Build month headers
  let monthHeaders = '';
  let cur = new Date(startDate);
  while(cur < endDate){
    const mStart = new Date(cur);
    const mEnd = new Date(cur); mEnd.setMonth(mEnd.getMonth()+1);
    const mDays = Math.min(daysBetween(mStart, endDate), daysBetween(mStart, mEnd));
    const pct = (mDays / totalDays * 100).toFixed(2);
    monthHeaders += `<div class="head-month" style="flex:0 0 ${pct}%">${cur.toLocaleDateString('es-ES',{month:'short',year:'2-digit'}).toUpperCase()}</div>`;
    cur.setMonth(cur.getMonth()+1);
  }

  // Today line
  const todayPct = todayOffset >= 0 && todayOffset <= totalDays ? (todayOffset / totalDays * 100).toFixed(2) : null;

  // Build rows per habitación
  let rows = '';
  for(const hab of HABITACIONES){
    const contratos = allContratos.filter(c => c.datos && +c.datos.hnum === hab);

    // Build bars
    let bars = '';
    for(const c of contratos){
      const d = c.datos;
      if(!d.fi || !d.ff) continue;
      const fi = parseLocalDate(d.fi);
      const ff = parseLocalDate(d.ff);
      if(!fi || !ff) continue;

      // Clip to view
      const barStart = fi < startDate ? startDate : fi;
      const barEnd   = ff > endDate   ? endDate   : ff;
      if(barStart >= endDate || barEnd <= startDate) continue;

      const left = (daysBetween(startDate, barStart) / totalDays * 100).toFixed(2);
      const width = (daysBetween(barStart, barEnd) / totalDays * 100).toFixed(2);
      const estado = getEstado(c);
      const nombre = d.tn ? d.tn.split(' ').slice(0,2).join(' ') : '—';
      const renta = d.renta ? `${d.renta}€` : '';

      bars += `<div class="gantt-bar ${estado}" style="left:${left}%;width:${width}%"
        onclick="abrirDetalle('${c.id}')" title="${nombre} · ${d.fi} → ${d.ff}">
        <span class="bar-name">${nombre}</span>
        <span class="bar-renta">${renta}</span>
      </div>`;
    }

    if(!bars){
      bars = '<div style="position:absolute;inset:0;display:flex;align-items:center;padding-left:8px"><span style="font-size:11px;color:#ccc;font-style:italic">Sin contratos</span></div>';
    }

    const todayLineHtml = todayPct !== null ? `<div class="today-line" style="left:${todayPct}%"></div>` : '';

    rows += `<div class="gantt-row">
      <div class="room-label">Hab. ${hab}</div>
      <div class="gantt-track">
        <div class="gantt-bg">${buildBgCells(startDate, endDate, totalDays)}</div>
        ${todayLineHtml}
        ${bars}
      </div>
    </div>`;
  }

  container.innerHTML = `<div class="gantt">
    <div class="gantt-head-row">
      <div class="head-room"></div>
      <div class="head-months">${monthHeaders}</div>
    </div>
    ${rows}
  </div>`;
}

function buildBgCells(start, end, totalDays){
  let html = '';
  let cur = new Date(start);
  while(cur < end){
    const next = new Date(cur); next.setDate(next.getDate()+1);
    const isFirst = cur.getDate() === 1;
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const isToday = cur.getTime() === hoy.getTime();
    html += `<div class="bg-cell${isFirst?' month-start':''}${isToday?' today':''}" style="flex:0 0 ${(1/totalDays*100).toFixed(3)}%"></div>`;
    cur = next;
  }
  return html;
}

function abrirDetalle(id){
  const c = allContratos.find(x => x.id === id);
  if(!c) return;
  const d = c.datos;
  const estado = getEstado(c);
  const labels = {activo:'✓ Activo', pendiente:'⏳ Pendiente', vencido:'📁 Histórico'};

  const meses = (() => {
    if(!d.fi || !d.ff) return '—';
    const fi = parseLocalDate(d.fi);
    const ff = parseLocalDate(d.ff);
    const m = (ff.getFullYear()-fi.getFullYear())*12 + ff.getMonth()-fi.getMonth();
    return m + ' mes' + (m!==1?'es':'');
  })();

  document.getElementById('detail-content').innerHTML = `
    <div class="detail-badge ${estado}">${labels[estado]}</div>
    <div class="detail-h">Habitación ${d.hnum} — ${d.tn || '—'}</div>
    <div class="detail-sub">DNI: ${d.td || '—'}</div>
    <div class="detail-grid">
      <div class="detail-item"><label>Inicio</label><span>${d.fi || '—'}</span></div>
      <div class="detail-item"><label>Fin</label><span>${d.ff || '—'}</span></div>
      <div class="detail-item"><label>Renta</label><span>${d.renta ? d.renta+'€/mes' : '—'}</span></div>
      <div class="detail-item"><label>Duración</label><span>${meses}</span></div>
      <div class="detail-item"><label>Fianza</label><span>${d.fianza ? d.fianza+'€' : '—'}</span></div>
      <div class="detail-item"><label>Seguro</label><span>${d.seguro ? 'Sí (SEAG)' : 'No'}</span></div>
    </div>
    ${d.av_nombre ? `<div style="font-size:12px;color:#666;margin-bottom:1rem">👤 Avalista: ${d.av_nombre}</div>` : ''}
    <div class="detail-actions">
      <a href="ver.html?id=${c.id}" class="btn-detail btn-detail-primary">Ver documentos</a>
      <a href="firmar.html?id=${c.id}&rol=arrendador" class="btn-detail btn-detail-sec">Firmar</a>
    </div>`;

  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('overlay-bg').classList.add('open');
}

function cerrarDetalle(){
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('overlay-bg').classList.remove('open');
}

async function init(){
  await loadContratos();
  const hoy = new Date();
  startDate = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1); // start 1 month before today
  renderGantt();
}

init();
</script>
</body>
</html>
