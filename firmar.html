<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contratos">
<meta name="theme-color" content="#1a1a1a">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firmar Contrato</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f4f0;color:#1a1a1a;min-height:100vh}
header{background:#1a1a1a;color:#fff;padding:1.25rem 2rem;display:flex;align-items:center;gap:.75rem}
header h1{font-size:1rem;font-weight:500}
.page{max-width:780px;margin:2rem auto;padding:0 1.5rem 4rem}
.card{background:#fff;border-radius:12px;padding:2rem;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:1.5rem}
.contract{font-family:Georgia,serif;font-size:11.5px;line-height:1.8;color:#1a1a1a}
.contract h1{font-size:13px;font-weight:700;text-align:center;margin-bottom:.4rem;letter-spacing:.05em}
.contract .sub{text-align:center;font-size:10.5px;color:#666;margin-bottom:1.25rem}
.contract h2{font-size:11.5px;font-weight:700;margin:1rem 0 .3rem;text-decoration:underline}
.contract p{margin-bottom:.5rem;text-align:justify}
.sign-section p{font-size:13px;color:#555;margin-bottom:1.25rem}
.sign-area{border:1.5px dashed #ccc;border-radius:10px;background:#fafafa;cursor:crosshair;display:block;touch-action:none}
.sign-controls{display:flex;gap:.75rem;margin-top:.75rem}
.btn-clear{padding:7px 16px;font-size:13px;border:1px solid #ddd;background:#fff;border-radius:7px;cursor:pointer;color:#555}
.btn-clear:hover{background:#f5f5f5}
.btn-firmar{flex:1;padding:10px;font-size:14px;font-weight:600;background:#1D9E75;color:white;border:none;border-radius:8px;cursor:pointer;transition:background .15s}
.btn-firmar:hover{background:#0F6E56}
.btn-firmar:disabled{background:#aaa;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:.4rem;font-size:12px;font-weight:500;padding:4px 10px;border-radius:20px;margin-bottom:1.25rem}
.badge.inquilino{background:#e8f5e9;color:#2e7d32}
.badge.arrendador{background:#e3f2fd;color:#1565c0}
.status-msg{padding:.875rem 1.25rem;border-radius:8px;font-size:14px;text-align:center;margin-top:1rem}
.status-msg.success{background:#e8f5e9;color:#2e7d32}
.status-msg.error{background:#fdecea;color:#c62828}
.ya-firmado{text-align:center;padding:2rem;color:#2e7d32}
.ya-firmado svg{width:48px;height:48px;margin-bottom:1rem;color:#1D9E75}
.ya-firmado h2{font-size:18px;margin-bottom:.5rem}
.ya-firmado p{font-size:14px;color:#555}
.scroll-hint{font-size:11px;color:#aaa;text-align:right;margin-bottom:.5rem}
.firma-existente{border:1px solid #e0e0e0;border-radius:8px;padding:.5rem;background:#f9f9f9;margin-bottom:.5rem}
.firma-existente img{max-width:200px;display:block}
.firma-existente span{font-size:11px;color:#888;display:block;margin-top:.3rem}
.anexo-embed{width:100%;border:none;border-radius:8px;background:#f5f5f5}
.step-indicator{display:flex;gap:0;margin-bottom:1.5rem;border-radius:8px;overflow:hidden;border:1px solid #e0e0e0}
.step{flex:1;padding:.625rem;text-align:center;font-size:11px;font-weight:500;background:#f9f9f9;color:#888}
.step.active{background:#1a1a1a;color:#fff}
.step.done{background:#1D9E75;color:#fff}
.section-divider{display:flex;align-items:center;gap:1rem;margin:1.5rem 0}
.section-divider span{font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.section-divider::before,.section-divider::after{content:'';flex:1;height:1px;background:#e8e8e8}
.ok-banner{background:#e8f5e9;border-radius:8px;padding:.875rem 1.25rem;font-size:13px;color:#2e7d32;margin-bottom:1.5rem}
</style>
</head>
<body>
<header>
  <img src="/icons/apple-touch-icon.png" style="width:36px;height:36px;border-radius:8px;object-fit:cover;">
  <h1>Firma de Documentos</h1>
</header>

<div class="page">
  <div id="main"><div class="card" style="text-align:center;padding:3rem;color:#888">Cargando...</div></div>
</div>

<script src="js/contrato.js"></script>
<script>
const SUPABASE_URL = 'https://kyrjqbautyklefhqzqbo.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5cmpxYmF1dHlrbGVmaHF6cWJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMDgwNjUsImV4cCI6MjA5NjY4NDA2NX0.EXBSK0ZLJUsWt1iQ8btA1FkQE_aPT_MFkdgEhkP4Gh0';

const params = new URLSearchParams(location.search);
const id = params.get('id');
const rol = params.get('rol');

let contrato = null;
let canvases = {};
let ctxs = {};
let lastX, lastY;

async function init(){
  if(!id || !rol){ showError('Enlace no válido.'); return; }
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/contratos?id=eq.${id}`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    if(!data.length){ showError('Contrato no encontrado.'); return; }
    contrato = data[0];
    render();
  } catch(e){ showError('Error al cargar el contrato.'); }
}

async function getPdfUrl(tipo, params){
  try {
    const res = await fetch(`/.netlify/functions/generar-${tipo}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(params)
    });
    const data = await res.json();
    if(data.pdf) return `data:application/pdf;base64,${data.pdf}`;
  } catch(e){ console.error(e); }
  return null;
}

async function render(){
  const d = contrato.datos;
  const conSeguro = !!d.seguro;
  const conAvalista = !!(d.avalista && d.av_nombre);
  const esAvalista = rol === 'avalista';
  const esInquilino = rol === 'inquilino';
  const esArrendador = rol === 'arrendador';

  // Per-role field mapping
  const campoContrato = esInquilino ? 'firma_inquilino' : esAvalista ? 'firma_avalista_contrato' : 'firma_arrendador';
  const campoLopd     = esInquilino ? 'firma_lopd_inquilino' : esAvalista ? 'firma_lopd_avalista' : 'firma_lopd_arrendador';

  const yaContrato = !!contrato[campoContrato];
  // Avalista: no anexo
  const yaAnexo = esAvalista ? true : (esInquilino ? !!contrato.firma_anexo_inquilino : !!contrato.firma_anexo_arrendador);
  const yaLopd  = !conSeguro || !!contrato[campoLopd];

  // Arrendador waits for inquilino to finish
  if(esArrendador && !contrato.firma_inquilino){
    showError('El arrendatario aún no ha firmado. Podrás firmarlo una vez complete su proceso.');
    return;
  }
  // Avalista must exist
  if(esAvalista && !conAvalista){
    showError('Este contrato no tiene avalista solidario.');
    return;
  }

  if(yaContrato && yaAnexo && yaLopd){
    document.getElementById('main').innerHTML = `
      <div class="card ya-firmado">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <h2>Todos los documentos firmados</h2>
        <p>${esArrendador ? 'El proceso está completamente firmado.' : 'Tus firmas han quedado registradas.'}</p>
        ${esArrendador ? `<p style="margin-top:1rem"><a href="ver.html?id=${id}" style="color:#1D9E75;font-weight:600">Ver documentos firmados →</a></p>` : ''}
      </div>`;
    return;
  }

  const nombreFirmante = esInquilino ? d.tn : esAvalista ? d.av_nombre : d.an;
  const rolLabel = esInquilino ? 'Arrendatario' : esAvalista ? 'Avalista' : 'Arrendador';
  const badgeClass = esInquilino ? 'inquilino' : esAvalista ? 'inquilino' : 'arrendador';
  const hoy = new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});

  // Steps depend on role
  const steps = [{ label: '1. Contrato', done: yaContrato }];
  if(!esAvalista) steps.push({ label: `${steps.length+1}. Anexo hab. ${d.hnum}`, done: yaAnexo });
  if(conSeguro)   steps.push({ label: `${steps.length+1}. Autorización LOPD`, done: yaLopd });

  const activeIdx = steps.findIndex(s => !s.done);
  const stepsHtml = steps.map((s,i) => {
    const cls = s.done ? 'done' : (i === activeIdx ? 'active' : '');
    return `<div class="step ${cls}">${s.label}</div>`;
  }).join('');

  let stepContent = '';

  if(!yaContrato){
    const firmasPrevias = [];
    if(contrato.firma_inquilino) firmasPrevias.push(`<div class="firma-existente"><img src="${contrato.firma_inquilino}"><span>Arrendatario: ${d.tn} — ${new Date(contrato.firmado_inquilino_at).toLocaleDateString('es-ES')}</span></div>`);
    if(contrato.firma_avalista_contrato) firmasPrevias.push(`<div class="firma-existente"><img src="${contrato.firma_avalista_contrato}"><span>Avalista: ${d.av_nombre}</span></div>`);

    stepContent = `
      <div class="scroll-hint">Lee el contrato completo antes de firmar</div>
      <div class="contract">${buildContrato(d)}</div>
      ${firmasPrevias.length && (esArrendador) ? `<div style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid #f0f0f0">${firmasPrevias.join('')}</div>` : ''}
      <div class="section-divider"><span>Tu firma del contrato</span></div>
      <div class="sign-section">
        <p>Dibuja tu firma para el contrato de arrendamiento.</p>
        <canvas class="sign-area" id="canvas-contrato" width="680" height="160"></canvas>
        <div class="sign-controls">
          <button class="btn-clear" onclick="clearCanvas('contrato')">Borrar</button>
          <button class="btn-firmar" id="btn-contrato" onclick="firmarDoc('contrato')">Firmar contrato →</button>
        </div>
        <div id="status-contrato"></div>
      </div>`;

  } else if(!yaAnexo){
    const anexoUrl = await getPdfUrl('anexo', { hnum: d.hnum, inquilino: d.tn, fecha: hoy });
    stepContent = `
      <div class="ok-banner">✅ Contrato firmado correctamente</div>
      <div class="scroll-hint">Lee el anexo completo antes de firmar</div>
      <p style="font-size:12px;color:#888;margin-bottom:.75rem">Anexo de inventario — Habitación ${d.hnum}</p>
      <iframe class="anexo-embed" src="${anexoUrl || `${SUPABASE_URL}/storage/v1/object/public/anexos/anexo-${d.hnum}.pdf`}" height="600"></iframe>
      ${contrato.firma_anexo_inquilino && esArrendador ? `
        <div style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid #f0f0f0">
          <div class="firma-existente"><img src="${contrato.firma_anexo_inquilino}"><span>Arrendatario: ${d.tn}</span></div>
        </div>` : ''}
      <div class="section-divider"><span>Tu firma del anexo</span></div>
      <div class="sign-section">
        <p>Dibuja tu firma para el anexo de inventario de la habitación ${d.hnum}.</p>
        <canvas class="sign-area" id="canvas-anexo" width="680" height="160"></canvas>
        <div class="sign-controls">
          <button class="btn-clear" onclick="clearCanvas('anexo')">Borrar</button>
          <button class="btn-firmar" id="btn-anexo" onclick="firmarDoc('anexo')">Firmar anexo →</button>
        </div>
        <div id="status-anexo"></div>
      </div>`;

  } else if(!yaLopd && conSeguro){
    const lopdUrl = await getPdfUrl('lopd', {
      cedente_nombre: d.an, cedente_nif: d.ad,
      cesionario1_nombre: d.tn, cesionario1_nif: d.td,
      cesionario2_nombre: conAvalista ? d.av_nombre : null,
      cesionario2_nif: conAvalista ? d.av_dni : null
    });
    const prevLopdFirmas = [];
    if(contrato.firma_lopd_inquilino) prevLopdFirmas.push(`<div class="firma-existente"><img src="${contrato.firma_lopd_inquilino}"><span>Arrendatario: ${d.tn}</span></div>`);
    if(contrato.firma_lopd_avalista) prevLopdFirmas.push(`<div class="firma-existente"><img src="${contrato.firma_lopd_avalista}"><span>Avalista: ${d.av_nombre}</span></div>`);

    stepContent = `
      <div class="ok-banner">✅ Pasos anteriores firmados correctamente</div>
      <div class="scroll-hint">Lee el documento LOPD antes de firmar</div>
      <p style="font-size:12px;color:#888;margin-bottom:.75rem">Autorización LOPD — Seguro de impago SEAG</p>
      <iframe class="anexo-embed" src="${lopdUrl || `${SUPABASE_URL}/storage/v1/object/public/anexos/lopd.pdf`}" height="700"></iframe>
      ${prevLopdFirmas.length && esArrendador ? `<div style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid #f0f0f0">${prevLopdFirmas.join('')}</div>` : ''}
      <div class="section-divider"><span>Tu firma de la autorización LOPD</span></div>
      <div class="sign-section">
        <p>Al firmar confirmas que aceptas la autorización LOPD para el seguro de impago.</p>
        <canvas class="sign-area" id="canvas-lopd" width="680" height="160"></canvas>
        <div class="sign-controls">
          <button class="btn-clear" onclick="clearCanvas('lopd')">Borrar</button>
          <button class="btn-firmar" id="btn-lopd" onclick="firmarDoc('lopd')">Firmar autorización →</button>
        </div>
        <div id="status-lopd"></div>
      </div>`;
  }

  document.getElementById('main').innerHTML = `
    <div class="step-indicator">${stepsHtml}</div>
    <div class="card">
      <span class="badge ${badgeClass}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Firmando como ${rolLabel}: ${nombreFirmante}
      </span>
      ${stepContent}
    </div>`;

  const currentCanvas = !yaContrato ? 'contrato' : (!yaAnexo ? 'anexo' : 'lopd');
  initCanvas(currentCanvas);
}

function initCanvas(tipo){
  const canvas = document.getElementById(`canvas-${tipo}`);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  canvases[tipo] = canvas; ctxs[tipo] = ctx;
  let drawing = false;
  canvas.addEventListener('mousedown', e => { drawing=true; [lastX,lastY]=getPos(canvas,e); });
  canvas.addEventListener('mousemove', e => { if(!drawing)return; drawLine(ctx,canvas,getPos(canvas,e)); });
  canvas.addEventListener('mouseup', ()=> drawing=false);
  canvas.addEventListener('mouseleave', ()=> drawing=false);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing=true; [lastX,lastY]=getPos(canvas,e.touches[0]); },{passive:false});
  canvas.addEventListener('touchmove', e => { e.preventDefault(); if(!drawing)return; drawLine(ctx,canvas,getPos(canvas,e.touches[0])); },{passive:false});
  canvas.addEventListener('touchend', ()=> drawing=false);
}

function getPos(canvas, e){
  const r = canvas.getBoundingClientRect();
  return [(e.clientX-r.left)*(canvas.width/r.width),(e.clientY-r.top)*(canvas.height/r.height)];
}
function drawLine(ctx, canvas, [x,y]){
  ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(x,y); ctx.stroke();
  [lastX,lastY]=[x,y];
}
function clearCanvas(tipo){ ctxs[tipo]?.clearRect(0,0,canvases[tipo].width,canvases[tipo].height); }
function isBlank(canvas){ return !canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data.some(v=>v!==0); }

async function firmarDoc(tipo){
  const canvas = canvases[tipo];
  if(!canvas || isBlank(canvas)){ showStatus(tipo,'error','Dibuja tu firma antes de continuar.'); return; }
  const btn = document.getElementById(`btn-${tipo}`);
  btn.disabled=true; btn.textContent='Guardando...';

  try {
    const firma = canvas.toDataURL('image/png');
    const esInquilino  = rol === 'inquilino';
    const esAvalista   = rol === 'avalista';
    const esArrendador = rol === 'arrendador';
    const d = contrato.datos;
    const conSeguro = !!d.seguro;
    const conAvalista = !!(d.avalista && d.av_nombre);
    const now = new Date().toISOString();

    let update = {};
    if(tipo === 'contrato'){
      if(esInquilino)  update = { firma_inquilino: firma, firmado_inquilino_at: now };
      if(esAvalista)   update = { firma_avalista_contrato: firma, firmado_avalista_contrato_at: now };
      if(esArrendador) update = { firma_arrendador: firma, firmado_arrendador_at: now };
    } else if(tipo === 'anexo'){
      if(esInquilino)  update = { firma_anexo_inquilino: firma, firmado_anexo_inquilino_at: now };
      if(esArrendador) update = { firma_anexo_arrendador: firma, firmado_anexo_arrendador_at: now };
    } else if(tipo === 'lopd'){
      if(esInquilino)  update = { firma_lopd_inquilino: firma, firmado_lopd_inquilino_at: now };
      if(esAvalista)   update = { firma_lopd_avalista: firma, firmado_lopd_avalista_at: now };
      if(esArrendador) update = { firma_lopd_arrendador: firma, firmado_lopd_arrendador_at: now };
    }

    const res = await fetch(`${SUPABASE_URL}/rest/v1/contratos?id=eq.${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Prefer':'return=representation' },
      body: JSON.stringify(update)
    });
    if(!res.ok) throw new Error('Error al guardar');
    const [updated] = await res.json();
    contrato = updated;

    const siteUrl = window.location.origin + window.location.pathname.replace('firmar.html','');
    // Last doc for each role
    const ultimoDocInquilino  = conSeguro ? 'lopd' : 'anexo';
    const ultimoDocAvalista   = conSeguro ? 'lopd' : 'contrato';
    const ultimoDocArrendador = conSeguro ? 'lopd' : 'anexo';
    const esUltimo = (esInquilino && tipo === ultimoDocInquilino) ||
                     (esAvalista  && tipo === ultimoDocAvalista)  ||
                     (esArrendador && tipo === ultimoDocArrendador);

    if(esUltimo){
      if(esArrendador){
        const linkVer = `${siteUrl}ver.html?id=${id}`;
        await fetch('/.netlify/functions/send-email', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            from:'onboarding@resend.dev', to: d.amail,
            subject:`✅ Todos los documentos firmados – Habitación ${d.hnum}`,
            html:`<p>Todos los documentos de la habitación ${d.hnum} han sido firmados.</p><p><a href="${linkVer}" style="background:#1D9E75;color:white;padding:10px 20px;border-radius:6px;text-decoration:none;display:inline-block;margin:8px 0">Ver documentos firmados</a></p>`
          })
        });
        window.location.href = `ver.html?id=${id}`;
      } else {
        // Generate downloadable PDFs for inquilino/avalista
        const hoy = new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});
        const nombreCorto = (esInquilino ? d.tn : d.av_nombre).split(' ')[0].toLowerCase();
        const btnStyle = 'display:block;margin:.5rem auto;padding:10px 20px;background:#1D9E75;color:white;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;width:fit-content';

        // Fetch fresh data to get all signatures
        const freshRes = await fetch(`${SUPABASE_URL}/rest/v1/contratos?id=eq.${id}`, {
          headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}
        });
        const [fresh] = await freshRes.json();

        let descargasHtml = '';

        // Anexo (solo inquilino)
        if(esInquilino){
          try {
            const r = await fetch('/.netlify/functions/generar-anexo', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ hnum: d.hnum, inquilino: d.tn, fecha: hoy, firma_inquilino: fresh.firma_anexo_inquilino, firma_arrendador: fresh.firma_anexo_arrendador })
            });
            const rd = await r.json();
            if(rd.pdf) descargasHtml += `<a href="data:application/pdf;base64,${rd.pdf}" download="anexo-hab${d.hnum}-${nombreCorto}.pdf" style="${btnStyle}">⬇ Anexo habitación ${d.hnum}</a>`;
          } catch(e){}
        }

        // LOPD (inquilino y avalista si hay seguro)
        if(conSeguro){
          try {
            const r = await fetch('/.netlify/functions/generar-lopd', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({
                cedente_nombre: d.an, cedente_nif: d.ad,
                cesionario1_nombre: d.tn, cesionario1_nif: d.td,
                cesionario2_nombre: conAvalista ? d.av_nombre : null,
                cesionario2_nif: conAvalista ? d.av_dni : null,
                firma_inquilino: fresh.firma_lopd_inquilino,
                firma_avalista: fresh.firma_lopd_avalista
              })
            });
            const rd = await r.json();
            if(rd.pdf) descargasHtml += `<a href="data:application/pdf;base64,${rd.pdf}" download="lopd-${nombreCorto}.pdf" style="${btnStyle}">⬇ Autorización LOPD</a>`;
          } catch(e){}
        }

        document.getElementById('main').innerHTML = `
          <div class="card ya-firmado">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <h2>¡Todos tus documentos firmados!</h2>
            <p>Tus firmas han quedado registradas correctamente.</p>
            ${descargasHtml ? `<div style="margin-top:1.5rem;border-top:1px solid #e0f2e9;padding-top:1.25rem">${descargasHtml}</div>` : ''}
          </div>`;
      }
    } else {
      render();
    }
  } catch(e){
    showStatus(tipo,'error','Error: '+e.message);
    btn.disabled=false;
    btn.textContent = tipo==='contrato' ? 'Firmar contrato →' : tipo==='anexo' ? 'Firmar anexo →' : 'Firmar autorización →';
  }
}

function showStatus(tipo, type, msg){
  const el = document.getElementById(`status-${tipo}`);
  if(!el) return;
  el.className='status-msg '+type; el.textContent=msg;
}
function showError(msg){
  document.getElementById('main').innerHTML=`<div class="card" style="text-align:center;padding:3rem;color:#c62828">${msg}</div>`;
}

init();
</script>
</body>
</html>
